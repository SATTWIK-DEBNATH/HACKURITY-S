<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0b1224"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="barSentinel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barSota" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="barNemo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="barIndustry" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barOauth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="barRaw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="956" height="366" rx="16" fill="url(#compBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title & Header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="50" y="42" fill="#ffffff" font-size="16" font-weight="800" letter-spacing="0.5">
      EMPIRICAL THREAT MITIGATION EFFICACY: LINEAR BENCHMARK COMPARISON
    </text>
    <text x="50" y="62" fill="#94a3b8" font-size="12">
      Red-Team Adversarial Corpus Evaluation (N=2,500 Invocations) across OWASP LLM01, LLM06 &amp; FinTech Vectors
    </text>
  </g>

  <!-- Grid Vertical Lines for Percentages (0%, 25%, 50%, 75%, 100%) -->
  <!-- Base X starts at 300, width is 580 (representing 100%) -->
  <!-- 0% = 300, 25% = 445, 50% = 590, 75% = 735, 100% = 880 -->
  <g stroke="#141f33" stroke-width="1" stroke-dasharray="3,3">
    <line x1="300" y1="80" x2="300" y2="310"/>
    <line x1="445" y1="80" x2="445" y2="310"/>
    <line x1="590" y1="80" x2="590" y2="310"/>
    <line x1="735" y1="80" x2="735" y2="310"/>
    <line x1="880" y1="80" x2="880" y2="310"/>
  </g>

  <!-- Horizontal Rows -->
  <!-- Bar 1: MCP Sentinel (99.4%) -> width = 580 * 0.994 = 576.5 -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="50" y="106" fill="#34d399" font-size="13" font-weight="800">MCP Sentinel (Zero-Trust)</text>
    <rect x="300" y="90" width="576.5" height="24" rx="5" fill="url(#barSentinel)"/>
    <text x="890" y="107" fill="#34d399" font-size="12" font-weight="800" font-family="'SF Mono', Consolas, monospace">99.4% (WINNER)</text>
  </g>

  <!-- Bar 2: SOTA Research Sandboxes (84.6%) -> width = 580 * 0.846 = 490.6 -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="50" y="146" fill="#cbd5e1" font-size="12" font-weight="600">SOTA Agent Sandboxes</text>
    <rect x="300" y="130" width="490.6" height="22" rx="5" fill="url(#barSota)"/>
    <text x="805" y="146" fill="#67e8f9" font-size="11" font-weight="700" font-family="'SF Mono', Consolas, monospace">84.6% (-14.8%)</text>
  </g>

  <!-- Bar 3: Prompt Guardrails (NeMo) (67.8%) -> width = 580 * 0.678 = 393.2 -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="50" y="186" fill="#cbd5e1" font-size="12" font-weight="600">Prompt Guardrails (NeMo)</text>
    <rect x="300" y="170" width="393.2" height="22" rx="5" fill="url(#barNemo)"/>
    <text x="708" y="186" fill="#c084fc" font-size="11" font-weight="700" font-family="'SF Mono', Consolas, monospace">67.8% (-31.6%)</text>
  </g>

  <!-- Bar 4: Industry Enterprise Median (58.4%) -> width = 580 * 0.584 = 338.7 -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="50" y="226" fill="#cbd5e1" font-size="12" font-weight="600">Industry Enterprise Median</text>
    <rect x="300" y="210" width="338.7" height="22" rx="5" fill="url(#barIndustry)"/>
    <text x="652" y="226" fill="#7dd3fc" font-size="11" font-weight="700" font-family="'SF Mono', Consolas, monospace">58.4% (-41.0%)</text>
  </g>

  <!-- Bar 5: OAuth 2.0 / Static Gateway (52.1%) -> width = 580 * 0.521 = 302.1 -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="50" y="266" fill="#cbd5e1" font-size="12" font-weight="600">OAuth 2.0 / Static Gateway</text>
    <rect x="300" y="250" width="302.1" height="22" rx="5" fill="url(#barOauth)"/>
    <text x="615" y="266" fill="#fcd34d" font-size="11" font-weight="700" font-family="'SF Mono', Consolas, monospace">52.1% (-47.3%)</text>
  </g>

  <!-- Bar 6: Raw LLM Baseline (38.2%) -> width = 580 * 0.382 = 221.5 -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="50" y="306" fill="#94a3b8" font-size="12" font-weight="600">Raw LLM Baseline (Unenforced)</text>
    <rect x="300" y="290" width="221.5" height="22" rx="5" fill="url(#barRaw)"/>
    <text x="535" y="306" fill="#94a3b8" font-size="11" font-weight="700" font-family="'SF Mono', Consolas, monospace">38.2% (-61.2%)</text>
  </g>

  <!-- Scale Axis at Bottom -->
  <line x1="300" y1="324" x2="880" y2="324" stroke="#334155" stroke-width="1.5"/>
  <g font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#64748b" text-anchor="middle">
    <text x="300" y="342">0%</text>
    <text x="445" y="342">25%</text>
    <text x="590" y="342">50%</text>
    <text x="735" y="342">75%</text>
    <text x="880" y="342" fill="#34d399" font-weight="700">100%</text>
  </g>
</svg>
