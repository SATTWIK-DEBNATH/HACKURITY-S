<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0b1224"/>
    </linearGradient>

    <!-- Curve Gradients -->
    <linearGradient id="benignGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="stepUpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="attackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#f43f5e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="956" height="436" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#141f33" stroke-width="1" stroke-dasharray="3,3">
    <line x1="80" y1="90" x2="900" y2="90"/>
    <line x1="80" y1="150" x2="900" y2="150"/>
    <line x1="80" y1="210" x2="900" y2="210"/>
    <line x1="80" y1="270" x2="900" y2="270"/>
  </g>

  <!-- Title & Top Legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="44" fill="#ffffff" font-size="16" font-weight="800" letter-spacing="0.5">
      EMPIRICAL GAUSSIAN PROBABILITY DENSITY DISTRIBUTION (N=2,500)
    </text>
    <text x="80" y="64" fill="#94a3b8" font-size="12">
      Contextual Threat Risk Engine Evaluation across Autonomous, Step-Up, and Adversarial Invocations
    </text>

    <!-- Top Badge AUC-ROC -->
    <rect x="740" y="28" width="160" height="28" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
    <text x="752" y="46" fill="#34d399" font-size="11" font-weight="700" font-family="'SF Mono', Consolas, monospace">
      AUC-ROC = 0.998
    </text>
  </g>

  <!-- Y-Axis Label -->
  <text x="32" y="210" fill="#64748b" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif" transform="rotate(-90, 32, 210)" text-anchor="middle">
    PROBABILITY DENSITY (f(x))
  </text>

  <!-- ================= CURVE 1: BENIGN TRAFFIC (Mean=10, Sigma=6) ================= -->
  <!-- Range: x=80 to x=300, Peak at x=160 (R=10), y=110 -->
  <path d="M 80,330 C 110,330 130,110 160,110 C 190,110 220,330 270,330 Z" fill="url(#benignGrad)"/>
  <path d="M 80,330 C 110,330 130,110 160,110 C 190,110 220,330 270,330" fill="none" stroke="#10b981" stroke-width="3" filter="url(#glowGreen)"/>

  <!-- Benign Peak Label -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    <rect x="105" y="80" width="110" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="160" y="95" fill="#a7f3d0" font-size="10" font-weight="700">BENIGN (μ=10, σ=6)</text>
  </g>

  <!-- ================= CURVE 2: HITL STEP-UP (Mean=55, Sigma=9) ================= -->
  <!-- Range: x=370 to x=660, Peak at x=520 (R=55), y=170 -->
  <path d="M 370,330 C 430,330 470,170 520,170 C 570,170 610,330 670,330 Z" fill="url(#stepUpGrad)"/>
  <path d="M 370,330 C 430,330 470,170 520,170 C 570,170 610,330 670,330" fill="none" stroke="#f59e0b" stroke-width="3" filter="url(#glowAmber)"/>

  <!-- Step-Up Peak Label -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    <rect x="460" y="140" width="120" height="22" rx="4" fill="#78350f" stroke="#d97706" stroke-width="1"/>
    <text x="520" y="155" fill="#fde68a" font-size="10" font-weight="700">STEP-UP (μ=55, σ=9)</text>
  </g>

  <!-- ================= CURVE 3: CRITICAL EXPLOITS (Mean=92, Sigma=5) ================= -->
  <!-- Range: x=710 to x=890, Peak at x=815 (R=92), y=90 -->
  <path d="M 710,330 C 750,330 785,90 815,90 C 845,90 870,330 900,330 Z" fill="url(#attackGrad)"/>
  <path d="M 710,330 C 750,330 785,90 815,90 C 845,90 870,330 900,330" fill="none" stroke="#f43f5e" stroke-width="3" filter="url(#glowRed)"/>

  <!-- Exploit Peak Label -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    <rect x="755" y="60" width="120" height="22" rx="4" fill="#881337" stroke="#e11d48" stroke-width="1"/>
    <text x="815" y="75" fill="#fecdd3" font-size="10" font-weight="700">ATTACKS (μ=92, σ=5)</text>
  </g>

  <!-- ================= THRESHOLD LINE 1: T1 = 30 ================= -->
  <line x1="320" y1="80" x2="320" y2="330" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="240" y="105" width="155" height="24" rx="5" fill="#181308" stroke="#f59e0b" stroke-width="1"/>
    <text x="248" y="121" fill="#fbbf24" font-size="10" font-weight="800">
      T1 = 30 (Autonomous Limit)
    </text>
  </g>

  <!-- ================= THRESHOLD LINE 2: T2 = 80 ================= -->
  <line x1="720" y1="80" x2="720" y2="330" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5,4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="645" y="105" width="150" height="24" rx="5" fill="#20070e" stroke="#f43f5e" stroke-width="1"/>
    <text x="653" y="121" fill="#fb7185" font-size="10" font-weight="800">
      T2 = 80 (Hard Deny Ceiling)
    </text>
  </g>

  <!-- X-Axis Line -->
  <line x1="80" y1="330" x2="900" y2="330" stroke="#334155" stroke-width="2"/>

  <!-- X-Axis Ticks & Numbers -->
  <g font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">
    <!-- Ticks -->
    <line x1="80" y1="330" x2="80" y2="336" stroke="#475569" stroke-width="1.5"/>
    <text x="80" y="352">0</text>

    <line x1="160" y1="330" x2="160" y2="336" stroke="#475569" stroke-width="1.5"/>
    <text x="160" y="352" fill="#34d399" font-weight="700">10</text>

    <line x1="240" y1="330" x2="240" y2="336" stroke="#475569" stroke-width="1.5"/>
    <text x="240" y="352">20</text>

    <line x1="320" y1="330" x2="320" y2="336" stroke="#f59e0b" stroke-width="2"/>
    <text x="320" y="352" fill="#fbbf24" font-weight="800">30</text>

    <line x1="440" y1="330" x2="440" y2="336" stroke="#475569" stroke-width="1.5"/>
    <text x="440" y="352">45</text>

    <line x1="520" y1="330" x2="520" y2="336" stroke="#475569" stroke-width="1.5"/>
    <text x="520" y="352" fill="#fbbf24" font-weight="700">55</text>

    <line x1="600" y1="330" x2="600" y2="336" stroke="#475569" stroke-width="1.5"/>
    <text x="600" y="352">65</text>

    <line x1="720" y1="330" x2="720" y2="336" stroke="#f43f5e" stroke-width="2"/>
    <text x="720" y="352" fill="#fb7185" font-weight="800">80</text>

    <line x1="815" y1="330" x2="815" y2="336" stroke="#475569" stroke-width="1.5"/>
    <text x="815" y="352" fill="#fb7185" font-weight="700">92</text>

    <line x1="900" y1="330" x2="900" y2="336" stroke="#475569" stroke-width="1.5"/>
    <text x="900" y="352">100</text>
  </g>

  <!-- X-Axis Title -->
  <text x="490" y="375" fill="#cbd5e1" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" letter-spacing="0.5">
    CONTEXTUAL THREAT RISK SCORE (0 - 100)
  </text>

  <!-- Bottom Legend Pill Badges -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">
    <!-- Point A Badge -->
    <rect x="80" y="395" width="225" height="26" rx="6" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1"/>
    <circle cx="95" cy="408" r="4" fill="#34d399"/>
    <text x="108" y="412" fill="#a7f3d0">Zone 1: Benign Pass (FPR &lt; 0.4%)</text>

    <!-- Point C Badge -->
    <rect x="330" y="395" width="280" height="26" rx="6" fill="#78350f" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="345" cy="408" r="4" fill="#fbbf24"/>
    <text x="358" y="412" fill="#fde68a">Zone 2: Dual-Custody HITL Holding Pen</text>

    <!-- Point E Badge -->
    <rect x="635" y="395" width="265" height="26" rx="6" fill="#881337" fill-opacity="0.6" stroke="#f43f5e" stroke-width="1"/>
    <circle cx="650" cy="408" r="4" fill="#f43f5e"/>
    <text x="663" y="412" fill="#fecdd3">Zone 3: Hard Deny &amp; Merkle Quarantined</text>
  </g>
</svg>
